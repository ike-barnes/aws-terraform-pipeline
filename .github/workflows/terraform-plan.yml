# Runs on every pull request to main.
#   1. checks: format, validate, lint, and security scan. No AWS access.
#   2. plan:   signs in to AWS with OIDC (no stored keys), runs
#              terraform plan, and posts the result on the pull request.
#
# Every third-party action is pinned to a full commit SHA, not a tag.
# Tags can be moved to malicious code (this happened to trivy-action in
# March 2026); a commit SHA cannot.

name: terraform-plan

# No paths filter: both checks are required by the branch ruleset, so
# they must report on every pull request, even docs-only ones.
on:
  pull_request:
    branches: [main]

# Least privilege by default. Jobs ask for more only if they need it.
permissions:
  contents: read

# A new push to the same pull request cancels the older run.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.5"
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: infra

jobs:
  checks:
    name: Format, validate, lint, scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Checkov security scan
        run: |
          pip install --quiet checkov==3.3.29
          checkov --directory . --framework terraform --compact --quiet

  plan:
    name: Terraform plan
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # request the OIDC token that AWS trusts
      pull-requests: write # post the plan as a comment

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          mask-aws-account-id: true # hide the account ID in public logs
          role-session-name: gha-plan-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show the identity in use
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes, 1 = error
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Post plan to the pull request
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-comment -->';
            // The comment is public: redact every 12-digit AWS account ID.
            let plan = fs.readFileSync('infra/plan.txt', 'utf8').replace(/\b\d{12}\b/g, '************');

            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['Plan failed: see the log'])[0];
            const status = { '0': 'No changes', '2': 'Changes to apply', '1': 'Plan failed' }[process.env.EXIT_CODE] || 'Unknown';

            const max = 60000; // GitHub comments are limited to 65,536 characters
            if (plan.length > max) {
              plan = plan.slice(-max);
              plan = '... (truncated, full output in the workflow log)\n' + plan;
            }

            const body = [
              marker,
              `### Terraform plan: ${status}`,
              `**${summary}**`,
              '',
              '<details><summary>Show full plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              `Commit ${context.sha.substring(0, 7)}, run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            // Update the existing plan comment instead of adding a new one on every push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
