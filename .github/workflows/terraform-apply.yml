# Deploys infra/ when a pull request is merged to main.
#
# The job runs in the "production" GitHub environment, which:
#   - pauses until a required reviewer approves the deployment, and
#   - only accepts the main branch.
# The AWS apply role trusts only tokens issued for that environment, so
# without the approval there are no credentials to change anything.

name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # manual re-run from the Actions tab

permissions:
  contents: read

# Never run two applies at once, and never cancel one halfway through.
concurrency:
  group: terraform-apply-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.5"
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: infra

jobs:
  apply:
    name: Terraform apply (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # the approval gate
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Show the identity in use
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=60s -out=tfplan

      # Apply exactly the plan above, nothing else.
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=60s -auto-approve tfplan

      - name: Show outputs
        run: terraform output -no-color
